<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorama Player</title>
    <link rel="stylesheet" href="lib/Pannellum2_5_6/view.css"/>
    <link rel="stylesheet" href="lib/Pannellum2_5_6/pannellum.css">
    <!-- Preload critical resources -->
    <link rel="preload" href="lib/Pannellum2_5_6/pannellum.js" as="script">
    <link rel="preload" href="lib/Pannellum2_5_6/libpannellum.js" as="script">
</head>
<body>
    <div id="canvas" role="main" aria-label="Panorama viewer"></div>

    <!-- Scripts -->
    <script src="lib/Pannellum2_5_6/pannellum.js" defer></script>
    <script src="lib/Pannellum2_5_6/libpannellum.js" defer></script>
    <script src="lib/Pannellum2_5_6/panorama_base.js" defer></script>
    <script src="lib/Pannellum2_5_6/panorama_player.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DOM loaded, creating PanoramaPlayer');
            try {
                // Получаем параметры из URL
                const params = new URLSearchParams(window.location.search);
                const projectName = params.get('project_name');
                const photo = params.get('photo');

                let initialImage = null;

                // Если указан конкретный фото - используем его
                if (photo) {
                    initialImage = photo;
                }
                // Если указан только проект - загружаем главную сцену
                else if (projectName) {
                    // Получаем конфигурацию проекта
                    const rootPath = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
                    const response = await fetch(rootPath + '/php/projects_list.php?project=' + encodeURIComponent(projectName));
                    const data = await response.json();

                    if (data.success && data.config && data.config.main_scene) {
                        // Формируем путь к главной сцене
                        initialImage = '/img/' + projectName + '/' + data.config.main_scene;
                    } else {
                        // Если главная сцена не задана - получаем список файлов и берем первый
                        const listResponse = await fetch(rootPath + '/php/file_list.php?project=' + encodeURIComponent(projectName));
                        const listData = await listResponse.json();
                        if (listData.success && listData.files && listData.files.length > 0) {
                            initialImage = '/img/' + projectName + '/' + listData.files[0].name;
                        }
                    }
                }

                window.panoramaPlayer = new PanoramaPlayer('canvas', initialImage);
                console.log('PanoramaPlayer created successfully');
            } catch(e) {
                console.error('Error creating PanoramaPlayer:', e);
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:red;color:white;padding:20px;z-index:99999;font-family:monospace;font-size:14px;';
                errorDiv.innerHTML = `<strong>Ошибка:</strong> ${e.message}`;
                document.body.appendChild(errorDiv);
            }
        });
    </script>
</body>
</html>
