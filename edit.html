<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор панорамных туров</title>
    <link rel="stylesheet" href="lib/Pannellum2_5_6/edit.css"/>
    <link rel="stylesheet" href="lib/Pannellum2_5_6/pannellum.css"/>
    <!-- Preload critical resources -->
    <link rel="preload" href="lib/Pannellum2_5_6/pannellum.js" as="script">
    <link rel="preload" href="lib/Pannellum2_5_6/libpannellum.js" as="script">
</head>
<body>
    <!-- Main panorama canvas -->
    <div id="canvas" role="main" aria-label="Панорамный редактор"></div>

    <!-- Modal for hotspot creation -->
    <div id="hotspotModal" class="modal" style="display:none;" role="dialog" aria-modal="true">
        <div class="modal-content">
            <span class="close" aria-label="Закрыть">&times;</span>
            <h2>Создание точки перехода</h2>

            <!-- Import success message -->
            <div id="importSuccess" class="import-success"></div>

            <!-- Main form -->
            <div class="form-group">
                <label for="hotspotName">Название точки</label>
                <input type="text" id="hotspotName" placeholder="Введите название" maxlength="100">
            </div>

            <!-- Path и Photo раздельно -->
            <div class="form-group">
                <label for="pathInput">Path (корневой URL)</label>
                <div class="url-input-group">
                    <input type="text" id="pathInput" placeholder="http://127.0.0.1/PanoView360_Html">
                    <button id="pastePathButton" class="btn btn-secondary" title="Вставить из буфера">📋 Вставить</button>
                </div>
                <small style="color:#666;display:block;margin-top:4px;">Путь к корневой папке с изображениями</small>
            </div>

            <div class="form-group">
                <label for="photoInput">Photo (относительный путь)</label>
                <div class="url-input-group">
                    <input type="text" id="photoInput" placeholder="img/13.08.2026/PIC_20260813_185852.jpg">
                    <button id="copyPathButton" class="btn btn-primary" title="Скопировать текущий путь с разделением">📋 Копировать</button>
                </div>
                <small style="color:#666;display:block;margin-top:4px;">Относительный путь от корня к изображению</small>
            </div>

            <!-- Полный URL для информации -->
            <div class="form-group">
                <label>Полный URL (генерируется автоматически)</label>
                <input type="text" id="fullUrlDisplay" readonly style="background:#f5f5f5;color:#333;font-size:12px;">
            </div>

            <div class="form-row">
                <div class="form-group-30">
                    <label for="hotspotType">Тип</label>
                    <select id="hotspotType">
                        <option value="scene">Сцена</option>
                        <option value="info">Информация</option>
                        <option value="custom">Пользовательский</option>
                    </select>
                </div>
                <div class="form-group-30">
                    <label for="hotspotText">Текст</label>
                    <input type="text" id="hotspotText" placeholder="Текст подсказки" maxlength="200">
                </div>
            </div>

            <!-- Preview section -->
            <div class="form-group-full">
                <button id="previewButton" class="btn btn-secondary">👁️ Предпросмотр</button>
            </div>

            <div id="previewContainer" class="preview-container" style="display:none;">
                <div class="iframe-container">
                    <div id="previewIframeContainer" style="width:100%;height:100%;"></div>
                </div>
                <div class="preview-coordinates">
                    <p>Выбранные координаты:</p>
                    <div id="selectedCoordinates" style="min-height:40px;">
                        <em>Не выбрано</em>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="modal-actions">
                <button id="saveHotspotButton" class="btn btn-success">💾 Сохранить</button>
                <button id="cancelButton" class="btn btn-secondary">❌ Отмена</button>
                <button id="exportJsonButton" class="btn btn-primary">📤 Экспорт JSON</button>
                <button id="importJsonButton" class="btn btn-warning">📥 Импорт JSON</button>
                <input type="file" id="jsonFileInput" class="file-input-hidden" accept=".json">
            </div>

            <!-- Hotspots list -->
            <div class="hotspots-list">
                <h3>Точки перехода</h3>
                <div id="hotspotsContainer">
                    <p style="color:#666;font-style:italic;">Нет созданных точек</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts - loaded with defer for performance -->
    <script src="lib/Pannellum2_5_6/pannellum.js" defer></script>
    <script src="lib/Pannellum2_5_6/libpannellum.js" defer></script>
    <script src="lib/Pannellum2_5_6/panorama_base.js" defer></script>
    <script src="lib/Pannellum2_5_6/panorama_edit.js" defer></script>

    <!-- Добавляем обработчик ошибок для отладки -->
    <script>
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.message, e.filename, e.lineno);
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:red;color:white;padding:20px;z-index:99999;font-family:monospace;font-size:14px;';
            errorDiv.innerHTML = `<strong>Ошибка:</strong> ${e.message}<br><small>${e.filename}:${e.lineno}</small>`;
            document.body.appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 10000);
        });

        console.log('Page loaded');
        console.log('URL:', window.location.href);
        console.log('Search params:', new URLSearchParams(window.location.search).toString());
    </script>
</body>
</html>
